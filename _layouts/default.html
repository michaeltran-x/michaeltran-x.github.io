<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></h1>

        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="Photo of {{ site.title }}" />
        {% endif %}

        <p>
          <a href="{{ "files/cv.pdf" | relative_url }}">CV</a> |
          <a href="mailto:m.tran@fu-berlin.de">Email</a> |
          <a href="https://www.linkedin.com/in/michael-tran-b99558231/">LinkedIn</a>
        </p>

        <p>{{ site.description }}</p>
      </header>
      <section>
        {{ content }}
      </section>
      <footer>
        <p><small>Theme: <a href="https://github.com/orderedlist/minimal">minimal</a> by <a href="https://github.com/orderedlist">orderedlist</a></small></p>
      </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
